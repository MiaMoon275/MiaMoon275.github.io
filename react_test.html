<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>React Test</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- React + ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel (damit JSX im Browser funktioniert) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function ProjectCard() {
    return (
        <div className="card m-3 shadow-sm" style={{ width: "300px" }}>

            <img
                src="https://via.placeholder.com/300x180"
                className="card-img-top"
                alt="project"
            />

            <div className="card-body">

                <h5 className="card-title">My Project</h5>

                <p className="card-text text-muted">
                    Simple React Bootstrap Card example.
                </p>

                <span className="badge bg-secondary me-1">React</span>
                <span className="badge bg-secondary">Bootstrap</span>

                <div className="mt-3">
                    <a href="#" className="btn btn-primary btn-sm">
                        Live
                    </a>
                </div>

            </div>
        </div>
    );
}

function App() {
    return (
        <div className="d-flex justify-content-center mt-5">
            <ProjectCard />
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

</body>
</html>
